<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの口元カルテ｜かわい潤</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#FDF9F7;color:#3D2B26;max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.screen{display:none;padding-bottom:80px}
.screen.active{display:block}
.top-hero{background:linear-gradient(160deg,#FFF5F2 0%,#FDF0EC 60%,#FFF8F4 100%);padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
.top-hero::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:#FDECEA;opacity:.5;pointer-events:none}
.top-hero::after{content:'';position:absolute;bottom:-40px;left:-30px;width:140px;height:140px;border-radius:50%;background:#FDF0F3;opacity:.6;pointer-events:none}
.top-label{display:inline-block;background:#E8846A;color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 14px;border-radius:20px;margin-bottom:18px;position:relative;z-index:1}
.top-title{font-size:26px;font-weight:700;line-height:1.5;color:#3D2B26;position:relative;z-index:1;margin-bottom:12px}
.top-title span{color:#E8846A}
.top-sub{font-size:13px;color:#8C6B5E;line-height:1.7;position:relative;z-index:1;margin-bottom:28px}
.btn-start{display:block;width:100%;background:#E8846A;color:#fff;font-size:16px;font-weight:700;padding:16px;border-radius:14px;border:none;cursor:pointer;letter-spacing:.05em;position:relative;z-index:1;box-shadow:0 6px 20px rgba(232,132,106,.35);transition:transform .15s}
.btn-start:active{transform:scale(.97)}
.top-note{font-size:11px;color:#B59A94;margin-top:14px;position:relative;z-index:1}
.progress-wrap{padding:16px 24px 0}
.progress-label{font-size:11px;color:#B59A94;margin-bottom:6px}
.progress-bar{height:4px;background:#F0E0DB;border-radius:2px}
.progress-fill{height:100%;background:#E8846A;border-radius:2px;transition:width .4s ease}
.q-wrap{padding:28px 24px 24px}
.q-num{font-size:11px;color:#E8846A;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.q-text{font-size:17px;font-weight:700;color:#3D2B26;line-height:1.6;margin-bottom:22px}
.q-note{font-size:12px;color:#B59A94;margin-top:-14px;margin-bottom:18px;line-height:1.5}
.choice-list{display:flex;flex-direction:column;gap:10px}
.choice-btn{background:#fff;border:1.5px solid #EDD8D3;border-radius:12px;padding:14px 16px;font-size:14px;color:#3D2B26;text-align:left;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s}
.choice-btn:active{border-color:#E8846A;background:#FFF5F2}
.result-hero{background:linear-gradient(160deg,#FFF5F2,#FDF0EC);padding:40px 24px 32px;text-align:center;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;top:-50px;right:-30px;width:150px;height:150px;border-radius:50%;background:#FDECEA;opacity:.5;pointer-events:none}
.result-label{display:inline-block;background:#E8846A;color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:5px 14px;border-radius:20px;margin-bottom:16px;position:relative;z-index:1}
.result-type{font-size:22px;font-weight:700;color:#3D2B26;line-height:1.5;position:relative;z-index:1;margin-bottom:10px}
.result-type span{color:#E8846A;display:block;font-size:18px;margin-bottom:4px}
.result-desc{font-size:13px;color:#8C6B5E;line-height:1.8;position:relative;z-index:1}
.result-body{padding:24px}
.section-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #F0E0DB}
.section-title{font-size:13px;font-weight:700;color:#E8846A;letter-spacing:.08em;margin-bottom:12px}
.section-text{font-size:14px;color:#3D2B26;line-height:1.8}
.check-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.check-icon{width:20px;height:20px;border-radius:50%;background:#FDECEA;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:11px;color:#E8846A;font-weight:700}
.care-tag{display:inline-block;background:#FFF5F2;border:1px solid #EDD8D3;border-radius:8px;padding:6px 12px;font-size:13px;color:#8C6B5E;margin:4px 4px 4px 0}
.ba-section{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid #F0E0DB}
.ba-header{background:#FFF5F2;padding:14px 20px;border-bottom:1px solid #F0E0DB}
.ba-header-title{font-size:13px;font-weight:700;color:#E8846A;letter-spacing:.08em;margin-bottom:4px}
.ba-header-sub{font-size:12px;color:#8C6B5E;line-height:1.5}
.ba-img{width:100%;display:block}
.ba-caption{padding:12px 16px;font-size:12px;color:#8C6B5E;line-height:1.6;border-top:1px solid #F9EDEA}
.msg-card{background:#FFF5F2;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #FDECEA}
.cta-box{background:linear-gradient(135deg,#E8846A,#D4604A);border-radius:20px;padding:28px 20px;margin-bottom:16px;color:#fff;text-align:center}
.cta-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.85;margin-bottom:10px}
.cta-title{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:14px}
.cta-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.cta-spec{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 8px;font-size:12px;line-height:1.5}
.cta-spec strong{display:block;font-size:15px;margin-bottom:2px}
.cta-desc{font-size:13px;line-height:1.8;opacity:.92;margin-bottom:20px}
.cta-btn{display:block;background:#fff;color:#E8846A;font-size:15px;font-weight:700;padding:16px;border-radius:12px;text-decoration:none;letter-spacing:.05em;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.cta-note{font-size:11px;opacity:.75;margin-top:12px;line-height:1.6}
.flyer-img{width:100%;display:block;border-radius:16px;margin-bottom:16px;border:1px solid #F0E0DB}
.disclaimer{font-size:11px;color:#C4A49D;text-align:center;line-height:1.7;padding:0 24px 16px}
.btn-retry{display:block;width:calc(100% - 48px);margin:0 24px;background:transparent;border:1.5px solid #EDD8D3;color:#B59A94;font-size:14px;padding:13px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>

<div id="top" class="screen active">
  <div class="top-hero">
    <div class="top-label">受講者専用 口元カルテ</div>
    <h1 class="top-title">あなたの口元カルテ<br><span>〜変化を加速させるために〜</span></h1>
    <p class="top-sub">セルフケアを続けているのに<br>まだ変化が感じられない原因を<br>一緒に見つけましょう。</p>
    <button class="btn-start" onclick="startQuiz()">診断をはじめる →</button>
    <p class="top-note">全8問・約2分で完了</p>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="progress-wrap">
    <div class="progress-label" id="prog-label">Q1 / 8</div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:12.5%"></div></div>
  </div>
  <div class="q-wrap" id="q-wrap"></div>
</div>

<div id="result" class="screen">
  <div class="result-hero">
    <div class="result-label">あなたの診断結果</div>
    <div id="result-type-area"></div>
  </div>
  <div class="result-body" id="result-body"></div>
</div>

function showScreen(id) {
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove("active");
  }
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function renderQ() {
  var q = questions[current];
  document.getElementById("prog-label").textContent = "Q" + (current+1) + " / " + questions.length;
  document.getElementById("prog-fill").style.width = (((current+1)/questions.length)*100) + "%";

  var html = '<div class="q-num">QUESTION ' + (current+1) + '</div>';
  html += '<div class="q-text">' + q.text + '</div>';
  if (q.note) html += '<div class="q-note">' + q.note + '</div>';
  html += '<div class="choice-list">';
  for (var i = 0; i < q.choices.length; i++) {
    html += '<button class="choice-btn" onclick="choose(' + i + ')">' + q.choices[i].text + '</button>';
  }
  html += '</div>';
  document.getElementById("q-wrap").innerHTML = html;

  // Q0（年代）のとき：名前入力欄追加＋2列グリッド
  if (current === 0) {
    var nameVal = window._userName || '';
    var nameDiv = document.createElement('div');
    nameDiv.style.cssText = 'margin-bottom:1rem;';
    nameDiv.innerHTML = '<p style="font-size:0.88rem;color:#888;margin-bottom:0.5rem;">📝 お名前（任意）<span style="font-size:0.8rem;color:#bbb;"> イニシャルや下の名前だけでもOK</span></p><input type="text" id="name-input" placeholder="例：じゅんこ、J・T" maxlength="20" value="' + nameVal + '" style="width:100%;padding:0.75rem 1rem;border:1.5px solid #e0c4cf;border-radius:10px;font-size:1rem;box-sizing:border-box;outline:none;">';
    var qWrap = document.getElementById('q-wrap');
    var qText = qWrap.querySelector('.q-text');
    qWrap.insertBefore(nameDiv, qText);
    var choiceList = qWrap.querySelector('.choice-list');
    if (choiceList) {
      choiceList.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;';
      choiceList.querySelectorAll('.choice-btn').forEach(function(b){
        b.style.padding = '0.6rem 0.4rem';

      });

  }
}

function choose(idx) {
  if (current === 0) {
    var ni = document.getElementById('name-input');
    if (ni) window._userName = ni.value.trim();
    window._userAge = questions[current].choices[idx].text;
  }
  answers[current] = questions[current].choices[idx].text;
  var c = questions[current].choices[idx];
  var keys = Object.keys(c.scores);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (scores[k] !== undefined) scores[k] += c.scores[k];
  }
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    renderQ();
  }
}
